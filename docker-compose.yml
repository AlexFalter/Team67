services:
  client:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in the .env file to the public server domain}
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - server
    restart: unless-stopped
    volumes:
      - caddy_data:/data
      - caddy_config:/config
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    environment:
      SERVER_PERF_LOG: ${SERVER_PERF_LOG:-0}
      SERVER_PERF_LOG_INTERVAL_MS: ${SERVER_PERF_LOG_INTERVAL_MS:-5000}
      SERVER_WS_COMPRESSION: ${SERVER_WS_COMPRESSION:-1}
      SERVER_WS_CONTEXT_TAKEOVER: ${SERVER_WS_CONTEXT_TAKEOVER:-1}
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
